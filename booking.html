<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Custom CSS -->
  <link rel="stylesheet" href="styling/styling.css">    
</head>
<a href="index.html" class="btn btn-secondary mb-3">Back to Home</a>

<body class="big-2">

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">Homboys Barber Shop</span>
  </div>
</nav>

<!-- BOOKING SECTION -->
<div class="container py-5">

  <div class="text-center mb-4">
    <h2>Book Your Appointment</h2>
    <p class="text-muted">Fill in the form below to reserve your spot</p>
  </div>

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card shadow p-4">

        <form>

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
          </div>

          <!-- Phone -->
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="07XXXXXXXX" required>
          </div>

          <!-- Service -->
          <div class="mb-3">
            <label class="form-label">Select Service</label>
            <select class="form-select" required>
              <option value="">Choose service</option>
              <option>Haircut</option>
              <option>Beard Trim</option>
              <option>Hair Wash</option>
              <option>Full Package</option>
            </select>
          </div>

          <!-- Date -->
          <div class="mb-3">
            <label class="form-label">Select Date</label>
            <input type="date" class="form-control" required>
          </div>

          <!-- Time -->
          <div class="mb-3">
            <label class="form-label">Select Time</label>
            <input type="time" class="form-control" required>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-dark w-100">
            Book Appointment
          </button>

        </form>

      </div>

    </div>

  </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
  <small>© 2026 Homboys Barber Shop</small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
