<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Shop</title>
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<hr>
<a href="index.html" class="btn btn-secondary mb-3">Back to Home</a>
<!-- CAROUSEL START -->
<div id="barberCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#barberCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#barberCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#barberCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="styling/New folder/slide-1.jpg" class="d-block w-100" alt="Slide 1">
        </div>

        <div class="carousel-item">
            <img src="styling/New folder/slide-2.jpg" class="d-block w-100" alt="Slide 2">
        </div>

        <div class="carousel-item">
            <img src="styling/New folder/slide-3.jpg" class="d-block w-100" alt="Slide 3">
        </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#barberCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#barberCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>
<!-- CAROUSEL END -->

<!-- BOOTSTRAP JS (REQUIRED) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
